name: CENTINELA PRO

on:
  schedule:
    # 14:00 VET (UTC-4) = 18:00 UTC — Ciclo único diario (15 calls, ventana 24h)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      horas_atras:
        description: "Horas hacia atrás para búsqueda ad-hoc (default: 24, max: 72)"
        required: false
        type: string
      profile:
        description: "Profile ad-hoc: vacío = cierre (15 calls, default) / matutino (10 calls)"
        required: false
        type: choice
        options:
          - ""
          - "cierre"
          - "matutino"
        default: ""

# Permisos: 'contents: write' habilita push a gh-pages (informes) y a la rama
# 'estado' (snapshots de Fase D). Ambas ramas se crean/actualizan solas.
permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Modelos
  MISTRAL_MODEL: mistral-large-latest
  MISTRAL_TOKENS: "4000"
  PERPLEXITY_MODEL: sonar
  PERPLEXITY_RECENCY: week
  PERPLEXITY_TIMEOUT: "45"
  # Rutas de configuración
  CENTINELA_CONFIG_PATH: config/monitor_noticias_multicapa_ve_v1_1.json
  CENTINELA_ACTORES_PATH: config/actores.json
  # Fase D — memoria entre cortes (1 = activado, 0 = desactivado)
  CENTINELA_ESTADO: "1"
  # Archivado de URLs (Wayback / Archive.today)
  ARCHIVE_URLS: "1"
  ARCHIVE_LIMIT: "12"
  ARCHIVE_TIMEOUT: "35"

jobs:
  ejecutar-centinela:
    runs-on: ubuntu-22.04
    # Concurrency: evita que dos corridas (cron + manual) se pisen al hacer
    # push a las ramas gh-pages / estado simultáneamente.
    concurrency:
      group: centinela-pro-run
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar identidad git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar monitor
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_REMITENTE: ${{ secrets.GMAIL_REMITENTE }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_DESTINATARIO: ${{ secrets.GMAIL_DESTINATARIO }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          CENTINELA_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          if [ -n "${{ github.event.inputs.horas_atras }}" ]; then
            python monitor.py "${{ github.event.inputs.horas_atras }}"
          else
            python monitor.py
          fi

      - name: Subir salidas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salidas-${{ github.run_id }}
          path: salidas/
          retention-days: 7
          if-no-files-found: ignore
