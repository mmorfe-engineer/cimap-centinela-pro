name: CENTINELA PRO - Módulo Nacional

on:
  schedule:
    # 15:00 VET (UTC-4) = 19:00 UTC
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      horas_atras:
        description: "Horas hacia atrás para búsqueda ad-hoc (default: 24, max: 72)"
        required: false
        type: string

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Configuración específica del módulo NACIONAL
  MODULO: "nacional"
  CENTINELA_PROFILE: "nacional"
  # Llamadas y tokens
  MISTRAL_MODEL: mistral-large-latest
  MISTRAL_TOKENS: "2000"
  PERPLEXITY_MODEL: sonar
  PERPLEXITY_RECENCY: week
  PERPLEXITY_TIMEOUT: "45"
  # Rutas de configuración
  CENTINELA_CONFIG_PATH: config/monitor_noticias_multicapa_ve_v1_1.json
  CENTINELA_ACTORES_PATH: config/actores.json
  # Fase D
  CENTINELA_ESTADO: "1"
  # Archivado de URLs
  ARCHIVE_URLS: "1"
  ARCHIVE_LIMIT: "8"
  ARCHIVE_TIMEOUT: "35"

jobs:
  ejecutar-centinela-nacional:
    runs-on: ubuntu-22.04
    concurrency:
      group: centinela-nacional-run
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar identidad git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar monitor nacional
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_REMITENTE: ${{ secrets.GMAIL_REMITENTE }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_DESTINATARIO: ${{ secrets.GMAIL_DESTINATARIO }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.horas_atras }}" ]; then
            python monitor_nacional.py "${{ github.event.inputs.horas_atras }}"
          else
            python monitor_nacional.py
          fi

      - name: Subir salidas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salidas-nacional-${{ github.run_id }}
          path: salidas/
          retention-days: 7
          if-no-files-found: ignore
